<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator</title>

<style>
:root {
    --primary: #6366f1;
    --secondary: #4f46e5;
    --bg: #0f172a;
    --card: rgba(255,255,255,0.08);
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card */
.container {
    background: var(--card);
    backdrop-filter: blur(12px);
    padding: 30px;
    border-radius: 20px;
    width: 380px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

h1 {
    margin-bottom: 20px;
}

/* Input */
input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin: 15px 0;
    font-size: 16px;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(45deg, var(--primary), var(--secondary));
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

/* Result Cards */
.results {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.box {
    background: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 10px;
}

.big {
    margin-top: 15px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
    <h1>🎂 Age Calculator</h1>

    <input type="date" id="dob">

    <button onclick="handleCalculate()">Calculate</button>

    <div class="results" id="mainResult"></div>
    <div class="big" id="extraResult"></div>
</div>

<script>
// ---------- Utility Functions ----------
function getDaysInMonth(year, month) {
    return new Date(year, month + 1, 0).getDate();
}

function validateDOB(dob) {
    if (!dob) return "Please select a date";
    if (new Date(dob) > new Date()) return "Future date not allowed";
    return null;
}

// ---------- Core Logic ----------
function calculateExactAge(birthDate, today) {
    let y = today.getFullYear() - birthDate.getFullYear();
    let m = today.getMonth() - birthDate.getMonth();
    let d = today.getDate() - birthDate.getDate();

    if (d < 0) {
        m--;
        d += getDaysInMonth(today.getFullYear(), today.getMonth() - 1);
    }

    if (m < 0) {
        y--;
        m += 12;
    }

    return { years: y, months: m, days: d };
}

// ---------- Extra Metrics ----------
function calculateExtras(birthDate, today) {
    let diff = today - birthDate;

    let days = Math.floor(diff / (1000 * 60 * 60 * 24));
    let hours = Math.floor(diff / (1000 * 60 * 60));
    let minutes = Math.floor(diff / (1000 * 60));
    let seconds = Math.floor(diff / 1000);

    return { days, hours, minutes, seconds };
}

// ---------- Main Handler ----------
function handleCalculate() {
    let dobValue = document.getElementById("dob").value;
    let error = validateDOB(dobValue);

    if (error) {
        alert(error);
        return;
    }

    let birthDate = new Date(dobValue);
    let today = new Date();

    let age = calculateExactAge(birthDate, today);
    let extra = calculateExtras(birthDate, today);

    // Render main
    document.getElementById("mainResult").innerHTML = `
        <div class="box"><h3>${age.years}</h3><p>Years</p></div>
        <div class="box"><h3>${age.months}</h3><p>Months</p></div>
        <div class="box"><h3>${age.days}</h3><p>Days</p></div>
    `;

    // Render extras
    document.getElementById("extraResult").innerHTML = `
        📊 Total Days: <b>${extra.days}</b><br>
        ⏱ Hours: <b>${extra.hours}</b> | Minutes: <b>${extra.minutes}</b><br>
        ⌛ Seconds: <b>${extra.seconds}</b>
    `;
}
</script>

</body>
</html>
