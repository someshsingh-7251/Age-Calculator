<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modern Age Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.container {
    backdrop-filter: blur(15px);
    background: rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    width: 350px;
    color: white;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    animation: fadeIn 1s ease-in-out;
}

h1 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin: 15px 0;
    font-size: 16px;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #00c6ff;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

.result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    line-height: 1.5;
}

/* Animation */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">
    <h1>🎂 Age Calculator</h1>
    
    <input type="date" id="dob">
    
    <button onclick="calculateAge()">Calculate Age</button>

    <div class="result" id="result"></div>
</div>

<script>
function calculateAge() {
    let dob = document.getElementById("dob").value;

    if (!dob) {
        document.getElementById("result").innerHTML = "⚠ Please select your date of birth";
        return;
    }

    let birthDate = new Date(dob);
    let today = new Date();

    let years = today.getFullYear() - birthDate.getFullYear();
    let months = today.getMonth() - birthDate.getMonth();
    let days = today.getDate() - birthDate.getDate();

    if (days < 0) {
        months--;
        days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    // Extra: total days lived
    let totalDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));

    document.getElementById("result").innerHTML = `
        🎉 <br>
        <strong>${years}</strong> Years <br>
        <strong>${months}</strong> Months <br>
        <strong>${days}</strong> Days <br><br>
        🧮 Total Days: <strong>${totalDays}</strong>
    `;
}
</script>

</body>
</html>
