<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Age Calculator</title>

<style>
:root {
    --primary: #6366f1;
    --secondary: #4f46e5;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.container {
    width: 380px;
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    text-align: center;
    animation: fadeIn 1s ease;
}

h1 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin: 15px 0;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(45deg, var(--primary), var(--secondary));
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

.results {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.box {
    background: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 10px;
}

.extra {
    margin-top: 15px;
    font-size: 14px;
    line-height: 1.6;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">
    <h1>🎂 Age Calculator</h1>

    <input type="date" id="dob">
    <button onclick="handleCalculate()">Calculate</button>

    <div class="results" id="mainResult"></div>
    <div class="extra" id="extraResult"></div>
</div>

<script>
// ---------- Zodiac ----------
function getZodiac(day, month) {
    const signs = [
        ["Capricorn", 19], ["Aquarius", 18], ["Pisces", 20],
        ["Aries", 19], ["Taurus", 20], ["Gemini", 20],
        ["Cancer", 22], ["Leo", 22], ["Virgo", 22],
        ["Libra", 22], ["Scorpio", 21], ["Sagittarius", 21],
        ["Capricorn", 31]
    ];
    return (day > signs[month][1]) ? signs[month+1][0] : signs[month][0];
}

// ---------- Next Birthday ----------
function getNextBirthday(birthDate) {
    let today = new Date();
    let next = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());

    if (next < today) {
        next.setFullYear(today.getFullYear() + 1);
    }

    let diff = next - today;
    return Math.ceil(diff / (1000 * 60 * 60 * 24));
}

// ---------- Live Age ----------
let interval;

function startLiveAge(birthDate) {
    clearInterval(interval);

    interval = setInterval(() => {
        let now = new Date();
        let seconds = Math.floor((now - birthDate) / 1000);

        let liveElement = document.getElementById("live");
        if (liveElement) {
            liveElement.innerHTML =
                `⏳ Live Age: <b>${seconds.toLocaleString()}</b> seconds`;
        }
    }, 1000);
}

// ---------- Main ----------
function handleCalculate() {
    let dobValue = document.getElementById("dob").value;

    if (!dobValue) {
        alert("⚠ Please select your date of birth");
        return;
    }

    let birthDate = new Date(dobValue);
    let today = new Date();

    if (birthDate > today) {
        alert("⚠ Future date not allowed");
        return;
    }

    // Age calculation
    let years = today.getFullYear() - birthDate.getFullYear();
    let months = today.getMonth() - birthDate.getMonth();
    let days = today.getDate() - birthDate.getDate();

    if (days < 0) {
        months--;
        days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    let totalDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));

    // Extras
    let zodiac = getZodiac(birthDate.getDate(), birthDate.getMonth());
    let nextBirthday = getNextBirthday(birthDate);

    // Render main
    document.getElementById("mainResult").innerHTML = `
        <div class="box"><h3>${years}</h3><p>Years</p></div>
        <div class="box"><h3>${months}</h3><p>Months</p></div>
        <div class="box"><h3>${days}</h3><p>Days</p></div>
    `;

    // Render extra
    document.getElementById("extraResult").innerHTML = `
        📊 Total Days: <b>${totalDays.toLocaleString()}</b><br>
        🎂 Next Birthday in: <b>${nextBirthday}</b> days<br>
        ♈ Zodiac Sign: <b>${zodiac}</b><br>
        <div id="live"></div>
    `;

    startLiveAge(birthDate);
}
</script>

</body>
</html>
